name: SafeTriage syntax and unit tests

on:
  push:
    branches: ["main", "fix/app-validation-and-explainability"]
  pull_request:
    branches: ["main"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install torch langdetect numpy
      - name: Check Python syntax
        run: python -m py_compile app.py src/safetriage_utils.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
